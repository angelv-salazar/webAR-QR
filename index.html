<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WebAR QR — diagnóstico 8</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#141414;font-family:system-ui,sans-serif}
#status{position:fixed!important;bottom:25px!important;left:12px!important;right:12px!important;z-index:2147483647!important;background:#101010!important;color:#fff!important;border:2px solid #34c786!important;border-radius:10px;padding:12px!important;font:13px/1.4 monospace!important;pointer-events:none!important;white-space:pre-wrap!important}
#hint{position:fixed;z-index:99999;top:12px;left:12px;right:12px;background:#101010dd;color:#fff;border-radius:10px;padding:10px;text-align:center;font-size:13px;pointer-events:none}
.a-enter-vr,.a-enter-ar{display:none!important}
</style>
</head>
<body>
<a-scene embedded vr-mode-ui="enabled: false" renderer="alpha: true; antialias: true" arjs="sourceType: webcam; sourceWidth: 480; sourceHeight: 640; displayWidth: 480; displayHeight: 640; videoTexture: false; debugUIEnabled: false">
<a-marker preset="hiro"><a-icosahedron position="0 0.6 0" radius="0.45" color="#34dd88" animation="property: rotation; to: 0 360 0; dur: 9000; loop: true; easing: linear"></a-icosahedron></a-marker>
<a-entity camera></a-entity>
</a-scene>
<div id="hint">Prueba 8: cámara + marcador Hiro</div>
<div id="status">Esperando video…</div>
<script>
(function(){
const label=document.getElementById('status');
function diagnose(){
const v=document.querySelector('video');
const scene=document.querySelector('a-scene');
if(!v){label.textContent='Sin video | escena: '+(scene&&scene.hasLoaded?'cargada':'iniciando');return}
const track=v.srcObject?.getVideoTracks?.()[0];
label.textContent='Video: '+v.videoWidth+'x'+v.videoHeight+' | ready '+v.readyState+
' | pista: '+(track?.readyState||'sin datos')+
'\nPantalla: '+innerWidth+'x'+innerHeight+
' | video CSS: '+Math.round(v.getBoundingClientRect().width)+'x'+Math.round(v.getBoundingClientRect().height);
}
setInterval(diagnose,700);diagnose();
})();
</script>
</body>
</html>
