<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebAR QR — prueba de video natural</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:system-ui,sans-serif}
#hint{position:fixed;z-index:30;top:12px;left:12px;right:12px;background:rgba(12,18,23,.88);color:#fff;border-radius:10px;padding:12px;text-align:center;font-size:14px;pointer-events:none}
a-scene{position:fixed!important;inset:0!important;width:100%!important;height:100%!important;background:transparent!important}
a-scene canvas{background:transparent!important}
.a-enter-vr,.a-enter-ar{display:none!important}
</style>
</head>
<body>
<div id="hint">Apuntá al marcador Hiro para ver el objeto 3D.</div>
<a-scene embedded xr-mode-ui="enabled: false" vr-mode-ui="enabled: false"
renderer="alpha: true; antialias: true; colorManagement: false"
background="color: #000000; transparent: true"
arjs="sourceType: webcam; videoTexture: false; debugUIEnabled: false;">
<a-marker preset="hiro">
<a-entity position="0 0.55 0">
<a-icosahedron radius="0.45" color="#47e6a1" animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear"></a-icosahedron>
</a-entity>
</a-marker>
<a-entity camera></a-entity>
</a-scene>
</body>
</html>
