<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebAR QR — Cámara proporcional</title>
<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
<script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.7/aframe/build/aframe-ar.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:system-ui,sans-serif}
a-scene{position:fixed!important;inset:0!important;width:100%!important;height:100dvh!important}
#hint{position:fixed;z-index:20;top:12px;left:12px;right:12px;background:#10151ad9;color:white;border-radius:10px;padding:12px;text-align:center;font-size:14px;pointer-events:none}
@supports not (height:100dvh){a-scene{height:100vh!important}}
/* Hide neither video nor 3D; maintain video's natural aspect ratio. */
video.arjs-video,video#arjs-video{object-fit:cover!important;object-position:center center!important}
</style>
</head>
<body>
<div id="hint">Apuntá al marcador Hiro para ver el objeto 3D.</div>
<a-scene embedded vr-mode-ui="enabled:false" renderer="logarithmicDepthBuffer:true; precision:mediump; alpha:true; colorManagement:false" arjs="sourceType:webcam; videoTexture:false; debugUIEnabled:false; detectionMode:mono_and_matrix; matrixCodeType:3x3;">
<a-marker preset="hiro">
<a-entity position="0 0.55 0">
<a-icosahedron radius="0.45" color="#47e6a1" material="metalness:0.2;roughness:0.35" animation="property:rotation;to:0 360 0;loop:true;dur:9000;easing:linear"></a-icosahedron>
</a-entity>
</a-marker>
<a-entity camera></a-entity>
</a-scene>
<script>
/* Size the source video and renderer together, while AR.js owns projection matrix. */
(function(){
 function fit(){
   var w=window.innerWidth, h=Math.round(window.visualViewport?window.visualViewport.height:window.innerHeight);
   var v=document.querySelector('video.arjs-video,video#arjs-video');
   if(v){
     Object.assign(v.style,{position:'fixed',left:'0px',top:'0px',width:w+'px',height:h+'px',marginLeft:'0px',marginTop:'0px',objectFit:'cover',zIndex:'-1'});
   }
   var scene=document.querySelector('a-scene');
   if(scene){
     scene.style.height=h+'px';scene.style.width=w+'px';
     if(scene.canvas){
       Object.assign(scene.canvas.style,{width:w+'px',height:h+'px',marginLeft:'0px',marginTop:'0px'});
     }
   }
 }
 const scene=document.querySelector('a-scene');
 scene.addEventListener('renderstart',()=>{fit();setTimeout(fit,700);setTimeout(fit,1800);});
 window.addEventListener('resize',fit);
 if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
 setInterval(fit,1500);
})();
</script>
</body>
</html>
