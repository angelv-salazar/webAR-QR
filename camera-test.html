<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prueba de cámara WebAR</title>
<style>html,body{margin:0;background:#171717;color:white;font-family:system-ui}main{padding:16px;max-width:650px;margin:auto}video{display:block;width:100%;max-height:70vh;object-fit:contain;background:#000}button{font:inherit;padding:12px;margin:8px 0}small{display:block;white-space:pre-wrap;overflow-wrap:anywhere}</style></head><body><main><h2>Prueba de cámara sin AR.js</h2><p>Esta página sirve para comparar el encuadre normal de tu cámara con el de la experiencia AR.</p><button id="start">Abrir cámara trasera</button><video autoplay muted playsinline></video><small id="info"></small><p>Si aquí ves un encuadre amplio pero en la otra página aparece muy ampliado, el recorte lo produce la presentación de AR.js.</p></main>
<script>
let stream;
document.getElementById('start').onclick=async()=>{
const info=document.getElementById('info'),video=document.querySelector('video');
try{
if(stream)stream.getTracks().forEach(t=>t.stop());
stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}}});
video.srcObject=stream; await video.play();
const track=stream.getVideoTracks()[0];
info.textContent='Resolución: '+video.videoWidth+' × '+video.videoHeight+'\nCámara: '+track.label+'\nConfiguración: '+JSON.stringify(track.getSettings());
}catch(e){info.textContent='Error: '+e.name+' — '+e.message;}
};
</script></body></html>
